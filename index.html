<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 외국어 대화 연습</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-sub: #6c757d;
      --primary: #4a7c59;
      --primary-hover: #3b6346;
      --ai-bubble: #e9ecef;
      --user-bubble: #e8f5e9;
      --active-highlight: #fff3cd;
      --diff-added: #d1ecf1;
      --border-radius: 12px;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: relative; }
    h1, h2 { color: var(--text-main); margin-top: 0; }
    .subtitle { color: var(--text-sub); font-size: 0.95rem; margin-bottom: 25px; }
    .step { display: none; }
    .step.active { display: block; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input[type="text"], select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ced4da; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }
    
    .key-info { margin-top: 6px; font-size: 0.8rem; color: var(--text-sub); }
    .key-info a { color: var(--primary); font-weight: 600; text-decoration: none; }

    button { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
    button:hover { background: var(--primary-hover); }
    button:disabled { background: #adb5bd; cursor: not-allowed; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-warning { background: #e67e22; }
    .btn-warning:hover { background: #d35400; }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline.active { background: var(--primary); color: white; }

    .mode-selector { display: flex; gap: 15px; margin-bottom: 20px; background: #e9ecef; padding: 8px; border-radius: 10px; }
    .mode-option { flex: 1; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; background: transparent; transition: 0.2s; }
    .mode-option.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    .chat-box { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; max-height: 450px; overflow-y: auto; padding-right: 5px; }
    .turn-card { padding: 15px; border-radius: var(--border-radius); border: 2px solid transparent; transition: all 0.3s ease; cursor: pointer; position: relative; }
    .turn-card:hover { border-color: #ced4da; }
    .turn-card.ai { background-color: var(--ai-bubble); align-self: flex-start; width: 90%; }
    .turn-card.user { background-color: var(--user-bubble); align-self: flex-end; width: 90%; }
    .turn-card.active-turn { background-color: var(--active-highlight); border-color: #ffe082; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .speaker-label { font-size: 0.8rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .script-text { font-size: 1.05rem; line-height: 1.6; }

    /* 일본어 후리가나 스타일 */
    ruby rt { font-size: 0.65em; color: #d9534f; font-weight: normal; }
    .hide-furigana ruby rt { display: none; }

    .control-panel { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e9ecef; }
    .audio-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .audio-controls button { margin-top: 0; font-size: 0.85rem; padding: 10px 5px; }
    .status-msg { font-size: 0.9rem; color: var(--primary); font-weight: bold; margin-bottom: 10px; min-height: 1.2em; }
    .diff-container { display: flex; flex-direction: column; gap: 20px; margin: 20px 0; }
    .diff-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #fdfdfd; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; }
    .diff-box h4 { margin: 0 0 8px 0; font-size: 0.85rem; color: var(--text-sub); }
    .diff-text { font-size: 0.95rem; line-height: 1.6; }
    .ins { background-color: var(--diff-added); padding: 2px 4px; border-radius: 4px; }
    .loading-spinner { text-align: center; padding: 40px; color: var(--text-sub); }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f1f3f5; padding: 8px 15px; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
    .speed-control-bar { display: flex; align-items: center; gap: 8px; }
    .speed-control-bar label { font-size: 0.85rem; font-weight: bold; margin: 0; }
    .speed-control-bar select { width: auto; padding: 4px 8px; font-size: 0.85rem; }

    /* 개선된 사전 말풍선 팝업 */
    .dict-popover { position: absolute; background: #2b2d42; color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 0.88rem; z-index: 1000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 280px; }
    .dict-popover-close { position: absolute; top: 6px; right: 10px; color: #aaa; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
    .dict-popover-close:hover { color: #fff; }
    .dict-link { display: inline-block; margin-top: 8px; color: #a5d6a7; text-decoration: underline; font-size: 0.8rem; }

    /* 대본 에디터 스타일 */
    .edit-turn-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .edit-turn-item select { width: 100px; }
    .edit-turn-item input { flex: 1; }
    .edit-turn-item button { width: auto; margin-top: 0; padding: 8px 12px; background: #dc3545; }
  </style>
</head>
<body>

<div class="container">
  <!-- 사전 팝업창 -->
  <div id="dictPopover" class="dict-popover">
    <span class="dict-popover-close" onclick="hideDictPopover()">×</span>
    <div id="dictContent"></div>
  </div>

  <!-- 1단계: 대본 생성 설정 -->
  <div id="step-1" class="step active">
    <h1>🌱 AI 대화 연습 설정</h1>
    <p class="subtitle">대본을 생성할 방법과 환경을 선택해 주세요.</p>
    
    <div class="mode-selector">
      <div id="mode-ai" class="mode-option active" onclick="setCreationMode('ai')">🤖 AI로 자동 생성하기</div>
      <div id="mode-manual" class="mode-option" onclick="setCreationMode('manual')">✏️ 대본 직접 입력하기</div>
    </div>

    <div id="ai-config-section">
      <div class="form-row">
        <div class="form-group">
          <label>사용할 AI 모델</label>
          <select id="apiProvider">
            <option value="gemini">Google Gemini (gemini-3.6-flash)</option>
            <option value="openai">OpenAI (gpt-4o-mini)</option>
          </select>
        </div>
        <div class="form-group">
          <label>API 키 입력</label>
          <input type="text" id="apiKey" placeholder="API Key를 입력하세요">
          <div class="key-info">
            🔑 <a id="keyLink" href="https://aistudio.google.com/" target="_blank">Google API Key 발급받기 ↗</a>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>학습 언어</label>
          <select id="language" onchange="toggleJaFuriganaBtnVisibility()">
            <option value="English">영어 (English)</option>
            <option value="Japanese">일본어 (Japanese)</option>
            <option value="Chinese">중국어 (Chinese)</option>
            <option value="Spanish">스페인어 (Spanish)</option>
          </select>
        </div>
        <div class="form-group">
          <label>문장 길이</label>
          <select id="length">
            <option value="short">짧은 문장</option>
            <option value="medium" selected>보통 문장</option>
            <option value="long">긴 문장</option>
          </select>
        </div>
        <div class="form-group">
          <label>대화 턴 수</label>
          <select id="turns">
            <option value="3" selected>3 턴</option>
            <option value="5">5 턴</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>주제 및 상황</label>
        <input type="text" id="context" placeholder="예: 카페에서 음료 주문하기">
      </div>

      <div class="form-group">
        <label>기타 추가 요청사항</label>
        <textarea id="customNotes" rows="2" placeholder="예: 비즈니스 어휘 위주로 구성해 줘"></textarea>
      </div>
    </div>

    <button type="button" id="next-btn" onclick="handleStep1Next()">다음 단계로 진행하기</button>
  </div>

  <!-- 2단계: 미리보기 및 편집 -->
  <div id="step-2" class="step">
    <h2>📜 맞춤 대화 대본 미리보기</h2>
    <p class="subtitle">생성된 대본을 확인하거나 수정 후 음성 대화를 시작해 보세요.</p>
    
    <div class="top-bar">
      <div style="display:flex; gap:8px;">
        <button type="button" id="dictBtn" class="btn-outline" style="width:auto; margin:0; padding:6px 12px; font-size:0.85rem;" onclick="toggleDictMode()">📖 사전 검색 모드: OFF</button>
        <button type="button" id="furiganaBtn2" class="btn-secondary" style="width:auto; margin:0; padding:6px 12px; font-size:0.85rem; display:none;" onclick="toggleFurigana()">🌸 가나 보기</button>
      </div>
      <div class="speed-control-bar">
        <label for="step2-speed">🔊 음성 속도:</label>
        <select id="step2-speed" onchange="syncSpeedOptions(this.value)">
          <option value="1.0">1.0배속</option>
          <option value="0.9">0.9배속</option>
          <option value="0.8">0.8배속</option>
          <option value="0.7" selected>0.7배속</option>
          <option value="0.6">0.6배속</option>
          <option value="0.5">0.5배속</option>
        </select>
      </div>
    </div>

    <div id="preview-box" class="chat-box"></div>

    <!-- 대본 에디터 영역 -->
    <div id="editor-box" style="display:none; margin: 20px 0;">
      <h3>✏️ 대본 직접 작성/수정</h3>
      <div id="editor-rows"></div>
      <button type="button" class="btn-secondary" style="width:auto;" onclick="addEditorRow()">+ 대화 추가하기</button>
      <button type="button" style="margin-top:15px;" onclick="saveEditedScript()">저장 완료 및 반영</button>
    </div>

    <div id="preview-action-btns" class="form-row" style="margin-top:15px;">
      <button type="button" class="btn-secondary" onclick="enableEditor()">✏️ 대본 수정/직접작성</button>
      <button type="button" onclick="startPractice()">🎙️ 음성 대화 시작하기</button>
    </div>
  </div>

  <!-- 3단계: 음성 대화 -->
  <div id="step-3" class="step">
    <h2>🎙️ 대화 진행 중</h2>
    <p class="subtitle">카드 문장을 클릭하면 언제든 다시 들을 수 있습니다.</p>
    
    <div class="top-bar">
      <div style="display:flex; gap:8px;">
        <button type="button" id="dictBtn3" class="btn-outline" style="width:auto; margin:0; padding:6px 12px; font-size:0.85rem;" onclick="toggleDictMode()">📖 사전 검색 모드: OFF</button>
        <button type="button" id="furiganaBtn3" class="btn-secondary" style="width:auto; margin:0; padding:6px 12px; font-size:0.85rem; display:none;" onclick="toggleFurigana()">🌸 가나 보기</button>
      </div>
      <div class="speed-control-bar">
        <label for="step3-speed">🔊 음성 속도:</label>
        <select id="step3-speed" onchange="syncSpeedOptions(this.value)">
          <option value="1.0">1.0배속</option>
          <option value="0.9">0.9배속</option>
          <option value="0.8">0.8배속</option>
          <option value="0.7" selected>0.7배속</option>
          <option value="0.6">0.6배속</option>
          <option value="0.5">0.5배속</option>
        </select>
      </div>
    </div>

    <div id="practice-box" class="chat-box"></div>
    
    <div class="control-panel">
      <div class="audio-controls">
        <button type="button" class="btn-secondary" onclick="stopTTSOnly()">⏹️ 음성 멈추기</button>
        <button type="button" class="btn-secondary" onclick="replayCurrentTurn()">🔄 현재 문장 듣기</button>
        <button type="button" class="btn-warning" onclick="resetPractice()">⏪ 대화 초기화</button>
      </div>
      <div id="status-msg" class="status-msg">준비 중...</div>
      <button type="button" id="mic-btn" onclick="toggleRecord()" disabled>🎤 말하기 시작</button>
    </div>
  </div>

  <!-- 4단계: 피드백 -->
  <div id="step-4" class="step">
    <h2>📊 대화 대조 피드백</h2>
    <p class="subtitle">견본 대본과 실제 사용자의 발화를 비교한 결과입니다.</p>
    <div id="diff-box" class="diff-container"></div>
    <button type="button" onclick="location.reload()">처음으로 돌아가기</button>
  </div>
</div>

<script>
  var creationMode = 'ai';
  var scriptData = [];
  var currentTurn = 0;
  var userRecordings = [];
  var recognition = null;
  var isRecording = false;
  var isDictMode = false;
  var showFurigana = true;

  document.getElementById('apiProvider').addEventListener('change', function(e) {
    var link = document.getElementById('keyLink');
    if (e.target.value === 'gemini') {
      link.href = 'https://aistudio.google.com/';
      link.innerText = 'Google API Key 발급받기 ↗';
    } else {
      link.href = 'https://platform.openai.com/api-keys';
      link.innerText = 'OpenAI API Key 발급받기 ↗';
    }
  });

  function toggleJaFuriganaBtnVisibility() {
    const isJa = document.getElementById('language').value === 'Japanese';
    document.getElementById('furiganaBtn2').style.display = isJa ? 'inline-block' : 'none';
    document.getElementById('furiganaBtn3').style.display = isJa ? 'inline-block' : 'none';
  }

  function toggleFurigana() {
    showFurigana = !showFurigana;
    const btnText = showFurigana ? "🌸 가나 감추기" : "🌸 가나 보기";
    document.getElementById('furiganaBtn2').innerText = btnText;
    document.getElementById('furiganaBtn3').innerText = btnText;
    
    document.querySelectorAll('.chat-box').forEach(box => {
      box.classList.toggle('hide-furigana', !showFurigana);
    });
  }

  function setCreationMode(mode) {
    creationMode = mode;
    document.getElementById('mode-ai').classList.toggle('active', mode === 'ai');
    document.getElementById('mode-manual').classList.toggle('active', mode === 'manual');
    
    var aiSection = document.getElementById('ai-config-section');
    var inputs = aiSection.querySelectorAll('input, select, textarea');
    inputs.forEach(el => el.disabled = (mode === 'manual'));

    document.getElementById('next-btn').innerText = mode === 'ai' ? '맞춤 대본 생성하기' : '직접 대본 작성하러 가기';
  }

  function handleStep1Next() {
    toggleJaFuriganaBtnVisibility();
    if (creationMode === 'ai') {
      requestMicPermissionAndStart();
    } else {
      scriptData = [];
      showStep('step-2');
      renderPreview();
      enableEditor();
    }
  }

  function syncSpeedOptions(val) {
    document.getElementById('step2-speed').value = val;
    document.getElementById('step3-speed').value = val;
  }

  function toggleDictMode() {
    isDictMode = !isDictMode;
    const btnText = isDictMode ? "📖 사전 검색 모드: ON" : "📖 사전 검색 모드: OFF";
    document.getElementById('dictBtn').innerText = btnText;
    document.getElementById('dictBtn3').innerText = btnText;
    document.getElementById('dictBtn').classList.toggle('active', isDictMode);
    document.getElementById('dictBtn3').classList.toggle('active', isDictMode);
    if (!isDictMode) hideDictPopover();
  }

  // 텍스트 드래그 감지 사전 팝업
  document.addEventListener('mouseup', function(e) {
    if (!isDictMode) return;
    const selectedText = window.getSelection().toString().trim();
    if (selectedText.length > 0 && selectedText.length < 50) {
      showDictPopover(e.pageX, e.pageY, selectedText);
    }
  });

  function showDictPopover(x, y, word) {
    const pop = document.getElementById('dictPopover');
    const content = document.getElementById('dictContent');
    const lang = document.getElementById('language').value;

    pop.style.left = Math.min(x - 20, window.innerWidth - 300) + 'px';
    pop.style.top = (y - 80) + 'px';
    pop.style.display = 'block';

    let dictUrl = "";
    if (lang === 'Japanese') dictUrl = `https://ja.dict.naver.com/#/search?query=${encodeURIComponent(word)}`;
    else if (lang === 'Chinese') dictUrl = `https://zh.dict.naver.com/#/search?query=${encodeURIComponent(word)}`;
    else if (lang === 'Spanish') dictUrl = `https://dict.naver.com/eskodict/#/search?query=${encodeURIComponent(word)}`;
    else dictUrl = `https://en.dict.naver.com/#/search?query=${encodeURIComponent(word)}`;

    content.innerHTML = `
      <strong>🔍 '${word}'</strong>
      <div style="margin-top:6px; color:#ddd;">사전에서 뜻 검색 준비 완료</div>
      <a href="${dictUrl}" target="_blank" class="dict-link">네이버 사전에서 자세히 보기 ↗</a>
    `;
  }

  function hideDictPopover() {
    document.getElementById('dictPopover').style.display = 'none';
  }

  async function requestMicPermissionAndStart() {
    var apiKeyVal = document.getElementById('apiKey').value.trim();
    if (!apiKeyVal) {
      alert("API 키를 입력해 주세요.");
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
      generateScript();
    } catch (err) {
      alert("마이크 권한 허용이 필요합니다.");
    }
  }

  async function generateScript() {
    var config = {
      provider: document.getElementById('apiProvider').value,
      apiKey: document.getElementById('apiKey').value.trim(),
      language: document.getElementById('language').value,
      length: document.getElementById('length').value,
      turns: document.getElementById('turns').value,
      context: document.getElementById('context').value,
      customNotes: document.getElementById('customNotes').value
    };

    showStep('step-2');
    document.getElementById('preview-box').innerHTML = '<div class="loading-spinner">✨ 맞춤 대본을 생성하고 있습니다...</div>';

    let jaFuriganaInstruction = "";
    if (config.language === 'Japanese') {
      jaFuriganaInstruction = "For Japanese Kanji words, wrap them with HTML ruby tags for furigana, like <ruby>私<rt>わたし</rt></ruby>.";
    }

    const prompt = `Create a realistic dialogue script based on the following requirements:
- Language: ${config.language}
- Context/Topic: ${config.context}
- Sentence Complexity: ${config.length}
- Number of Turns: ${config.turns} turns (1 turn = 1 AI response + 1 User response)
- Additional Notes: ${config.customNotes}
${jaFuriganaInstruction}

CRITICAL: Return ONLY a valid JSON Array format like below, with no extra text or markdown syntax.
[
  {"role": "AI", "text": "..."},
  {"role": "User", "text": "..."}
]`;

    try {
      let jsonString = "";
      if (config.provider === 'gemini') {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${config.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        jsonString = data.candidates[0].content.parts[0].text;
      } else {
        const res = await fetch(`https://api.openai.com/v1/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "system", content: "You output JSON arrays only." }, { role: "user", content: prompt }]
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        jsonString = data.choices[0].message.content;
      }

      jsonString = jsonString.replace(/```json/g, "").replace(/
